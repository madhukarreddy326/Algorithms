apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "etcd-backup.fullname" . }}-script
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "etcd-backup.labels" . | nindent 4 }}
data:
  backup-etcd.sh: |
    #!/bin/bash
    set -euo pipefail

    # Color output
    RED='\033[0;31m'
    GREEN='\033[0;32m'
    YELLOW='\033[1;33m'
    NC='\033[0m' # No Color

    log_info() {
        echo -e "${GREEN}[INFO]${NC} $(date '+%Y-%m-%d %H:%M:%S') - $1"
    }

    log_error() {
        echo -e "${RED}[ERROR]${NC} $(date '+%Y-%m-%d %H:%M:%S') - $1" >&2
    }

    log_warn() {
        echo -e "${YELLOW}[WARN]${NC} $(date '+%Y-%m-%d %H:%M:%S') - $1"
    }

    # Configuration from environment
    ETCDCTL_API=${ETCDCTL_API:-3}
    ENDPOINTS=${ETCD_ENDPOINTS:-"https://127.0.0.1:2379"}
    CACERT=${ETCD_CACERT:-"/etc/kubernetes/pki/etcd/ca.crt"}
    CERT=${ETCD_CERT:-"/etc/kubernetes/pki/etcd/server.crt"}
    KEY=${ETCD_KEY:-"/etc/kubernetes/pki/etcd/server.key"}
    BACKUP_DIR=${BACKUP_DIR:-"/backup/snapshots"}
    CLUSTER_NAME=${CLUSTER_NAME:-"default"}
    COMPRESSION_ENABLED=${COMPRESSION_ENABLED:-"true"}
    VERIFICATION_ENABLED=${VERIFICATION_ENABLED:-"true"}

    # Generate timestamp and filename
    TIMESTAMP=$(date +%Y%m%d-%H%M%S)
    SNAPSHOT_NAME="etcd-snapshot-${CLUSTER_NAME}-${TIMESTAMP}.db"
    SNAPSHOT_PATH="${BACKUP_DIR}/${SNAPSHOT_NAME}"

    log_info "Starting etcd backup for cluster: ${CLUSTER_NAME}"
    log_info "Backup will be saved to: ${SNAPSHOT_PATH}"

    # Create backup directory
    mkdir -p "${BACKUP_DIR}"

    # Check etcd health before backup
    log_info "Checking etcd health..."
    if etcdctl endpoint health \
        --endpoints="${ENDPOINTS}" \
        --cacert="${CACERT}" \
        --cert="${CERT}" \
        --key="${KEY}" 2>&1 | grep -q "is healthy"; then
        log_info "etcd is healthy"
    else
        log_error "etcd health check failed!"
        exit 1
    fi

    # Get etcd member list
    log_info "etcd cluster members:"
    etcdctl member list \
        --endpoints="${ENDPOINTS}" \
        --cacert="${CACERT}" \
        --cert="${CERT}" \
        --key="${KEY}" \
        --write-out=table || true

    # Take snapshot
    log_info "Taking etcd snapshot..."
    START_TIME=$(date +%s)
    
    if etcdctl snapshot save "${SNAPSHOT_PATH}" \
        --endpoints="${ENDPOINTS}" \
        --cacert="${CACERT}" \
        --cert="${CERT}" \
        --key="${KEY}"; then
        
        END_TIME=$(date +%s)
        DURATION=$((END_TIME - START_TIME))
        
        log_info "Snapshot saved successfully in ${DURATION} seconds"
        
        # Get file size
        SNAPSHOT_SIZE=$(du -h "${SNAPSHOT_PATH}" | cut -f1)
        log_info "Snapshot size: ${SNAPSHOT_SIZE}"
        
        # Verify snapshot integrity
        if [ "${VERIFICATION_ENABLED}" = "true" ]; then
            log_info "Verifying snapshot integrity..."
            if etcdctl snapshot status "${SNAPSHOT_PATH}" --write-out=table; then
                log_info "Snapshot verification passed"
            else
                log_error "Snapshot verification failed!"
                exit 1
            fi
        fi
        
        # Compress snapshot if enabled
        if [ "${COMPRESSION_ENABLED}" = "true" ]; then
            log_info "Compressing snapshot..."
            gzip -f "${SNAPSHOT_PATH}"
            COMPRESSED_PATH="${SNAPSHOT_PATH}.gz"
            COMPRESSED_SIZE=$(du -h "${COMPRESSED_PATH}" | cut -f1)
            log_info "Compressed snapshot size: ${COMPRESSED_SIZE}"
        fi
        
        # Get some etcd statistics
        log_info "etcd Statistics:"
        echo "---"
        etcdctl endpoint status \
            --endpoints="${ENDPOINTS}" \
            --cacert="${CACERT}" \
            --cert="${CERT}" \
            --key="${KEY}" \
            --write-out=table || true
        echo "---"
        
        # Count total keys in etcd
        TOTAL_KEYS=$(etcdctl get / --prefix --keys-only \
            --endpoints="${ENDPOINTS}" \
            --cacert="${CACERT}" \
            --cert="${CERT}" \
            --key="${KEY}" 2>/dev/null | wc -l)
        log_info "Total keys in etcd: ${TOTAL_KEYS}"
        
        log_info "Backup completed successfully!"
        log_info "Backup file: $(ls -lh ${BACKUP_DIR}/${SNAPSHOT_NAME}* | awk '{print $9, $5}')"
        
        # Create metadata file
        cat > "${BACKUP_DIR}/${SNAPSHOT_NAME}.metadata" <<EOF
    {
      "timestamp": "${TIMESTAMP}",
      "cluster_name": "${CLUSTER_NAME}",
      "snapshot_file": "${SNAPSHOT_NAME}",
      "size_bytes": $(stat -c%s "${SNAPSHOT_PATH}" 2>/dev/null || stat -f%z "${SNAPSHOT_PATH}"),
      "duration_seconds": ${DURATION},
      "total_keys": ${TOTAL_KEYS},
      "etcd_version": "$(etcdctl version | head -1)",
      "kubernetes_version": "$(kubectl version --short 2>/dev/null | head -1 || echo 'N/A')"
    }
    EOF
        
        exit 0
    else
        log_error "Failed to take etcd snapshot!"
        exit 1
    fi
